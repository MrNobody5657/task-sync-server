<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мои Задачи</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --text: #e0e0e0; --accent: #bb86fc; --success: #03dac6; --priority-high: #ff5252; --priority-med: #ffd740; --priority-low: #69f0ae; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; padding-bottom: 80px; }
        h1 { font-size: 24px; margin-bottom: 20px; color: var(--accent); text-align: center; }
        
        .input-group { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333; background-color: var(--card); color: var(--text); font-size: 16px; min-width: 150px; }
        input[type="text"]:focus { outline: none; border-color: var(--accent); }
        select { padding: 12px; border-radius: 8px; border: 1px solid #333; background-color: var(--card); color: var(--text); font-size: 14px; cursor: pointer; }
        select:focus { outline: none; border-color: var(--accent); }
        button.add-btn { padding: 12px 20px; border: none; border-radius: 8px; background-color: var(--accent); color: #000; font-weight: bold; font-size: 16px; cursor: pointer; flex-basis: 100%; }
        button.add-btn:active { opacity: 0.7; }

        .controls { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        .filter-btn { padding: 8px 16px; border-radius: 20px; border: 1px solid #444; background: transparent; color: var(--text); font-size: 14px; cursor: pointer; white-space: nowrap; }
        .filter-btn.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: bold; }
        
        .task-list { display: flex; flex-direction: column; gap: 10px; }
        .task-item { background-color: var(--card); padding: 15px; border-radius: 8px; display: flex; flex-direction: column; gap: 12px; border-left: 4px solid #333; transition: all 0.3s ease; position: relative; }
        .task-item.p-high { border-left-color: var(--priority-high); }
        .task-item.p-med { border-left-color: var(--priority-med); }
        .task-item.p-low { border-left-color: var(--priority-low); }
        
        .task-item.done { opacity: 0.5; background-color: #181818; border-left-color: #444; }
        .task-item.done .task-title { text-decoration: line-through; color: #888; }
        .task-item.done .priority-badge { filter: grayscale(1); opacity: 0.5; }
        
        .task-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .task-title-wrapper { flex: 1; }
        .title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .task-title { font-size: 16px; word-break: break-word; }
        .priority-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; text-transform: uppercase; }
        .p-high .priority-badge { background: rgba(255, 82, 82, 0.2); color: var(--priority-high); }
        .p-med .priority-badge { background: rgba(255, 215, 64, 0.2); color: var(--priority-med); }
        .p-low .priority-badge { background: rgba(105, 240, 174, 0.2); color: var(--priority-low); }
        .task-date { font-size: 11px; color: #888; display: block; margin-top: 6px; }
        .task-actions { display: flex; gap: 5px; align-items: center; }
        .check-btn { background: none; border: 2px solid #444; border-radius: 50%; width: 28px; height: 28px; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 16px; color: transparent; transition: all 0.2s; }
        .check-btn:active { transform: scale(0.9); }
        .check-btn.done { background-color: var(--success); border-color: var(--success); color: #000; }
        .delete-btn { background: none; border: none; font-size: 20px; cursor: pointer; padding: 5px; border-radius: 5px; }
        .delete-btn:active { background-color: #333; }
        
        .progress-controls { display: flex; align-items: center; gap: 10px; background: #252525; padding: 8px 12px; border-radius: 8px; }
        input[type="range"] { flex: 1; -webkit-appearance: none; background: transparent; height: 6px; }
        input[type="range"]::-webkit-slider-runnable-track { width: 100%; height: 6px; cursor: pointer; background: #333; border-radius: 3px; }
        input[type="range"]::-webkit-slider-thumb { height: 16px; width: 16px; border-radius: 50%; background: var(--accent); cursor: pointer; -webkit-appearance: none; margin-top: -5px; }
        .task-item.done input[type="range"]::-webkit-slider-thumb { background: #555; }
        input[type="number"] { width: 50px; padding: 4px; border-radius: 4px; border: 1px solid #444; background: var(--bg); color: var(--text); text-align: center; font-size: 14px; }
        input[type="number"]:focus { outline: none; border-color: var(--accent); }
        .percent-sign { font-size: 14px; color: #888; }

        .subtasks-container { border-top: 1px dashed #333; padding-top: 10px; margin-top: 5px; }
        .subtask-item { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
        .subtask-item input[type="checkbox"] { appearance: none; width: 18px; height: 18px; border: 2px solid #555; border-radius: 4px; cursor: pointer; position: relative; }
        .subtask-item input[type="checkbox"]:checked { background-color: var(--accent); border-color: var(--accent); }
        .subtask-item input[type="checkbox"]:checked::after { content: '✔'; position: absolute; top: -2px; left: 2px; color: #000; font-size: 14px; font-weight: bold; }
        .subtask-text { font-size: 14px; color: #ccc; flex: 1; }
        .subtask-item.done .subtask-text { text-decoration: line-through; color: #666; }
        .subtask-delete { background: none; border: none; color: #666; cursor: pointer; font-size: 14px; }
        .add-subtask-row { display: flex; gap: 5px; margin-top: 5px; }
        .add-subtask-row input { flex: 1; padding: 6px; font-size: 12px; border-radius: 4px; border: 1px solid #444; background: #121212; color: #fff; }
        .add-subtask-row button { padding: 4px 10px; border-radius: 4px; border: none; background: var(--accent); color: #000; cursor: pointer; font-size: 12px; }
        
        .empty-msg { text-align: center; color: #666; margin-top: 40px; font-style: italic; }
    </style>
</head>
<body>
    <h1>📱 Мои Задачи</h1>
    
    <div class="input-group">
        <input type="text" id="taskInput" placeholder="Что нужно сделать?" autocomplete="off">
        <select id="priorityInput">
            <option value="low">Низкий</option>
            <option value="med" selected>Средний</option>
            <option value="high">Высокий</option>
        </select>
        <button class="add-btn" id="addBtn">+ Добавить</button>
    </div>

    <div class="controls">
        <button class="filter-btn active" onclick="setFilter('all')">Все</button>
        <button class="filter-btn" onclick="setFilter('active')">Активные</button>
        <button class="filter-btn" onclick="setFilter('done')">📦 Архив</button>
        <button class="filter-btn" onclick="toggleSort()" id="sortBtn" style="margin-left: auto;">Сначала новые ↓</button>
    </div>

    <div class="task-list" id="taskList"></div>

    <script>
        const API_URL = 'https://task-sync-server.onrender.com/api/tasks';
        let tasks = [];
        let currentFilter = 'all'; 
        let currentSort = 'new';   
        
        const taskInput = document.getElementById('taskInput');
        const priorityInput = document.getElementById('priorityInput');
        const addBtn = document.getElementById('addBtn');
        const taskList = document.getElementById('taskList');
        const sortBtn = document.getElementById('sortBtn');

        async function loadTasks() {
            taskList.innerHTML = '<div class="empty-msg">Загрузка с сервера... (до 50 сек)</div>';
            try {
                const response = await fetch(API_URL);
                if (response.ok) {
                    tasks = await response.json();
                    renderTasks();
                }
            } catch (e) {
                console.error("Ошибка загрузки", e);
                taskList.innerHTML = '<div class="empty-msg">Нет связи с сервером.</div>';
            }
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderTasks();
        }

        function toggleSort() {
            currentSort = currentSort === 'new' ? 'priority' : 'new';
            sortBtn.innerText = currentSort === 'new' ? 'Сначала новые ↓' : 'По важности ↓';
            renderTasks();
        }

        function formatDate(isoString) {
            if (!isoString) return '';
            const date = new Date(isoString);
            const now = new Date();
            const isToday = date.getDate() === now.getDate() && date.getMonth() === now.getMonth() && date.getFullYear() === now.getFullYear();
            const time = date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            return isToday ? `Сегодня, ${time}` : `${date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' })}, ${time}`;
        }

        function getPriorityClass(p) { return p === 'high' ? 'p-high' : p === 'low' ? 'p-low' : 'p-med'; }
        function getPriorityName(p) { return p === 'high' ? 'Высокий' : p === 'low' ? 'Низкий' : 'Средний'; }
        function getPriorityWeight(p) { return p === 'high' ? 3 : p === 'med' ? 2 : 1; }

        function parseSubtasks(str) {
            try { return str ? JSON.parse(str) : []; } catch(e) { return []; }
        }

        function renderTasks() {
            taskList.innerHTML = '';
            
            let filteredTasks = tasks.filter(task => {
                if (currentFilter === 'active') return task.progress < 100;
                if (currentFilter === 'done') return task.progress === 100;
                return true;
            });

            if (currentSort === 'new') {
                filteredTasks.sort((a, b) => b.id - a.id);
            } else if (currentSort === 'priority') {
                filteredTasks.sort((a, b) => getPriorityWeight(b.priority) - getPriorityWeight(a.priority));
            }

            if (filteredTasks.length === 0) {
                taskList.innerHTML = `<div class="empty-msg">${currentFilter === 'done' ? 'Архив пуст' : 'Здесь пока пусто'}</div>`;
                return;
            }

            filteredTasks.forEach((task) => {
                const index = tasks.findIndex(t => t.id === task.id); 
                const div = document.createElement('div');
                const pClass = getPriorityClass(task.priority || 'med');
                const isDone = task.progress === 100 ? 'done' : '';
                div.className = `task-item ${pClass} ${isDone}`;
                
                const dateStr = formatDate(task.created_at);
                const dateHtml = dateStr ? `<span class="task-date">${dateStr}</span>` : '';
                
                const subtasks = parseSubtasks(task.subtasks);
                let subtasksHtml = '';
                if (subtasks.length > 0) {
                    subtasksHtml = '<div class="subtasks-container">';
                    subtasks.forEach((sub, subIndex) => {
                        subtasksHtml += `
                            <div class="subtask-item ${sub.done ? 'done' : ''}">
                                <input type="checkbox" ${sub.done ? 'checked' : ''} onchange="toggleSubtask(${index}, ${subIndex})">
                                <span class="subtask-text">${sub.text}</span>
                                <button class="subtask-delete" onclick="deleteSubtask(${index}, ${subIndex})">✖</button>
                            </div>
                        `;
                    });
                    subtasksHtml += '</div>';
                }

                div.innerHTML = `
                    <div class="task-header">
                        <div class="task-title-wrapper">
                            <div class="title-row">
                                <span class="task-title">${task.title}</span>
                                <span class="priority-badge">${getPriorityName(task.priority || 'med')}</span>
                            </div>
                            ${dateHtml}
                        </div>
                        <div class="task-actions">
                            <button class="check-btn ${isDone ? 'done' : ''}" onclick="toggleComplete(${index})">✓</button>
                            <button class="delete-btn" onclick="deleteTask(${index})">🗑️</button>
                        </div>
                    </div>
                    
                    ${subtasksHtml}

                    <div class="add-subtask-row">
                        <input type="text" id="subInput_${index}" placeholder="Добавить шаг..." onkeypress="if(event.key==='Enter') addSubtask(${index})">
                        <button onclick="addSubtask(${index})">+</button>
                    </div>

                    <div class="progress-controls">
                        <input type="range" min="0" max="100" value="${task.progress}" oninput="updateProgress(${index}, this.value)" onchange="saveToServer(${index})">
                        <input type="number" min="0" max="100" value="${task.progress}" onchange="updateProgress(${index}, this.value); saveToServer(${index})">
                        <span class="percent-sign">%</span>
                    </div>
                `;
                taskList.appendChild(div);
            });
        }

        async function addSubtask(taskIndex) {
            const input = document.getElementById(`subInput_${taskIndex}`);
            const text = input.value.trim();
            if (!text) return;

            const task = tasks[taskIndex];
            let subtasks = parseSubtasks(task.subtasks);
            subtasks.push({ text: text, done: false });
            
            task.subtasks = JSON.stringify(subtasks);
            input.value = '';
            renderTasks();
            saveToServer(taskIndex);
        }

        async function toggleSubtask(taskIndex, subIndex) {
            const task = tasks[taskIndex];
            let subtasks = parseSubtasks(task.subtasks);
            
            subtasks[subIndex].done = !subtasks[subIndex].done;
            task.subtasks = JSON.stringify(subtasks);

            const doneCount = subtasks.filter(s => s.done).length;
            const totalCount = subtasks.length;
            task.progress = Math.round((doneCount / totalCount) * 100);

            renderTasks();
            saveToServer(taskIndex);
        }

        async function deleteSubtask(taskIndex, subIndex) {
            const task = tasks[taskIndex];
            let subtasks = parseSubtasks(task.subtasks);
            subtasks.splice(subIndex, 1);
            
            task.subtasks = JSON.stringify(subtasks);
            
            if (subtasks.length > 0) {
                const doneCount = subtasks.filter(s => s.done).length;
                task.progress = Math.round((doneCount / subtasks.length) * 100);
            }
            
            renderTasks();
            saveToServer(taskIndex);
        }

        async function addTask() {
            const title = taskInput.value.trim();
            if (!title) return;
            const newTask = { title: title, priority: priorityInput.value, progress: 0, created_at: new Date().toISOString(), subtasks: '[]' };
            taskInput.value = '';
            try {
                const response = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(newTask) });
                if (response.ok) {
                    const data = await response.json();
                    newTask.id = data.id;
                    tasks.push(newTask); 
                    renderTasks();
                }
            } catch (e) { alert("Сервер спит, попробуйте через минуту"); }
        }

        function updateProgress(index, value) {
            let val = parseInt(value);
            if (isNaN(val)) val = 0;
            if (val < 0) val = 0; if (val > 100) val = 100;
            tasks[index].progress = val;
            renderTasks(); 
        }

        async function saveToServer(index) {
            const task = tasks[index];
            if (!task.id) return;
            try {
                await fetch(`${API_URL}/${task.id}`, { 
                    method: 'PUT', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ 
                        id: task.id, 
                        progress: task.progress, 
                        priority: task.priority,
                        subtasks: task.subtasks
                    }) 
                });
            } catch (e) { console.log("Офлайн"); }
        }

        function toggleComplete(index) {
            tasks[index].progress = tasks[index].progress === 100 ? 0 : 100;
            let subtasks = parseSubtasks(tasks[index].subtasks);
            if (tasks[index].progress === 100) {
                subtasks.forEach(s => s.done = true);
            } else {
                subtasks.forEach(s => s.done = false);
            }
            tasks[index].subtasks = JSON.stringify(subtasks);
            
            renderTasks();
            saveToServer(index);
        }

        async function deleteTask(index) {
            if (!confirm('Удалить эту задачу?')) return;
            const task = tasks[index];
            tasks.splice(index, 1);
            renderTasks();
            if (task.id) {
                try { await fetch(`${API_URL}/${task.id}`, { method: 'DELETE' }); } catch (e) { console.log("Офлайн"); }
            }
        }

        addBtn.addEventListener('click', addTask);
        taskInput.addEventListener('keypress', function(e) { if (e.key === 'Enter') addTask(); });
        loadTasks();
    </script>
</body>
</html>
