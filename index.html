<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мои Задачи</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --text: #e0e0e0; --accent: #bb86fc; --success: #03dac6; --priority-high: #ff5252; --priority-med: #ffd740; --priority-low: #69f0ae; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; padding-bottom: 80px; }
        h1 { font-size: 24px; margin-bottom: 20px; color: var(--accent); text-align: center; }
        
        .screen { display: none; }
        .screen.active { display: block; }

        .auth-container { max-width: 400px; margin: 50px auto; text-align: center; }
        .auth-container input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #333; background: var(--card); color: var(--text); font-size: 16px; }
        .auth-container button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: var(--accent); color: #000; font-weight: bold; font-size: 16px; cursor: pointer; margin-bottom: 10px; }
        .auth-container button:active { opacity: 0.7; }

        .offline-banner { background: #cf6679; color: #000; text-align: center; padding: 8px; font-size: 14px; font-weight: bold; border-radius: 8px; margin-bottom: 15px; display: none; }
        .offline-banner.active { display: block; }

        /* Стили для поиска */
        .search-bar { margin-bottom: 15px; }
        #searchInput { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background-color: var(--card); color: var(--text); font-size: 16px; }
        #searchInput:focus { outline: none; border-color: var(--accent); }

        .input-group { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333; background-color: var(--card); color: var(--text); font-size: 16px; min-width: 150px; }
        select { padding: 12px; border-radius: 8px; border: 1px solid #333; background-color: var(--card); color: var(--text); font-size: 14px; cursor: pointer; }
        
        #customIntervalInput { display: none; width: 80px; padding: 12px; border-radius: 8px; border: 1px solid #333; background-color: var(--card); color: var(--text); font-size: 16px; }
        #customIntervalInput.visible { display: block; }

        button.add-btn { padding: 12px 20px; border: none; border-radius: 8px; background-color: var(--accent); color: #000; font-weight: bold; font-size: 16px; cursor: pointer; flex-basis: 100%; }

        .controls { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        .filter-btn { padding: 8px 16px; border-radius: 20px; border: 1px solid #444; background: transparent; color: var(--text); font-size: 14px; cursor: pointer; white-space: nowrap; }
        .filter-btn.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: bold; }
        
        .task-list { display: flex; flex-direction: column; gap: 10px; }
        .task-item { background-color: var(--card); padding: 15px; border-radius: 8px; display: flex; flex-direction: column; gap: 12px; border-left: 4px solid #333; transition: all 0.3s ease; position: relative; }
        .task-item.p-high { border-left-color: var(--priority-high); }
        .task-item.p-med { border-left-color: var(--priority-med); }
        .task-item.p-low { border-left-color: var(--priority-low); }
        .task-item.done { opacity: 0.5; background-color: #181818; border-left-color: #444; }
        .task-item.done .task-title { text-decoration: line-through; color: #888; }
        
        .task-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .task-title-wrapper { flex: 1; }
        .title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .task-title { font-size: 16px; word-break: break-word; }
        .priority-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; text-transform: uppercase; }
        .p-high .priority-badge { background: rgba(255, 82, 82, 0.2); color: var(--priority-high); }
        .p-med .priority-badge { background: rgba(255, 215, 64, 0.2); color: var(--priority-med); }
        .p-low .priority-badge { background: rgba(105, 240, 174, 0.2); color: var(--priority-low); }
        
        .repeat-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #333; color: #ccc; }
        
        .task-actions { display: flex; gap: 5px; align-items: center; }
        .check-btn { background: none; border: 2px solid #444; border-radius: 50%; width: 28px; height: 28px; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 16px; color: transparent; transition: all 0.2s; }
        .check-btn.done { background-color: var(--success); border-color: var(--success); color: #000; }
        .delete-btn { background: none; border: none; font-size: 20px; cursor: pointer; padding: 5px; border-radius: 5px; }
        
        .progress-controls { display: flex; align-items: center; gap: 10px; background: #252525; padding: 8px 12px; border-radius: 8px; }
        input[type="range"] { flex: 1; -webkit-appearance: none; background: transparent; height: 6px; }
        input[type="range"]::-webkit-slider-runnable-track { width: 100%; height: 6px; cursor: pointer; background: #333; border-radius: 3px; }
        input[type="range"]::-webkit-slider-thumb { height: 16px; width: 16px; border-radius: 50%; background: var(--accent); cursor: pointer; -webkit-appearance: none; margin-top: -5px; }
        .percent-sign { font-size: 14px; color: #888; }

        .empty-msg { text-align: center; color: #666; margin-top: 40px; font-style: italic; }
        .logout-btn { position: absolute; top: 20px; right: 20px; background: none; border: none; color: #cf6679; cursor: pointer; font-size: 14px; }
        .loading { text-align: center; color: #888; margin-top: 20px; font-style: italic; }
    </style>
</head><body>
    <div id="authScreen" class="screen active">
        <div class="auth-container">
            <h1>📱 Мои Задачи</h1>
            <input type="email" id="authEmail" placeholder="Email">
            <input type="password" id="authPassword" placeholder="Пароль">
            <button id="loginBtn">Войти</button>
            <button id="registerBtn" style="background: transparent; border: 1px solid #444; color: #fff;">Зарегистрироваться</button>
            <p id="authError" style="color: #cf6679; margin-top: 10px;"></p>
        </div>
    </div>

    <div id="mainScreen" class="screen">
        <button class="logout-btn" id="logoutBtn">Выйти</button>
        <div id="offlineBanner" class="offline-banner">⚡ Офлайн-режим</div>
        <h1>📱 Мои Задачи</h1>
        
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 Поиск по задачам..." oninput="renderTasks()">
        </div>

        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Что нужно сделать?">
            <select id="priorityInput">
                <option value="low">Низкий</option>
                <option value="med" selected>Средний</option>
                <option value="high">Высокий</option>
            </select>
            <select id="repeatInput" onchange="toggleCustomInterval()">
                <option value="none" selected>Не повторять</option>
                <option value="daily">Каждый день</option>
                <option value="weekly">Каждую неделю</option>
                <option value="custom">Свой интервал...</option>
            </select>
            <input type="number" id="customIntervalInput" min="1" placeholder="Дней">
            <button class="add-btn" id="addBtn">+ Добавить</button>
        </div>

        <div class="controls">
            <button class="filter-btn active" onclick="setFilter('all')">Все</button>
            <button class="filter-btn" onclick="setFilter('active')">Активные</button>
            <button class="filter-btn" onclick="setFilter('done')">📦 Архив</button>
        </div>

        <div class="task-list" id="taskList"></div>
    </div>    <script>
        const API_BASE = 'https://task-sync-server.onrender.com';
        let tasks = [];
        let currentFilter = 'all'; 
        let authToken = localStorage.getItem('auth_token');

        const authScreen = document.getElementById('authScreen');
        const mainScreen = document.getElementById('mainScreen');
        const taskInput = document.getElementById('taskInput');
        const priorityInput = document.getElementById('priorityInput');
        const repeatInput = document.getElementById('repeatInput');
        const customIntervalInput = document.getElementById('customIntervalInput');
        const addBtn = document.getElementById('addBtn');
        const taskList = document.getElementById('taskList');
        const offlineBanner = document.getElementById('offlineBanner');
        const authError = document.getElementById('authError');
        const searchInput = document.getElementById('searchInput');

        function toggleCustomInterval() {
            if (repeatInput.value === 'custom') customIntervalInput.classList.add('visible');
            else customIntervalInput.classList.remove('visible');
        }

        function checkAuth() {
            if (authToken && authToken !== 'undefined') {
                authScreen.classList.remove('active');
                mainScreen.classList.add('active');
                loadTasks();
            } else {
                authScreen.classList.add('active');
                mainScreen.classList.remove('active');
            }
        }

        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            authError.innerText = '';
            
            const formData = new URLSearchParams();
            formData.append('username', email);
            formData.append('password', password);

            try {
                const res = await fetch(`${API_BASE}/api/login`, { method: 'POST', body: formData });
                if (res.ok) {
                    const data = await res.json();
                    authToken = data.access_token;
                    localStorage.setItem('auth_token', authToken);
                    checkAuth();
                } else {
                    authError.innerText = 'Неверный email или пароль';
                }
            } catch (e) {
                authError.innerText = 'Ошибка сети. Сервер спит?';
            }
        });

        document.getElementById('registerBtn').addEventListener('click', async () => {
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            authError.innerText = '';
            
            try {
                const res = await fetch(`${API_BASE}/api/register`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                if (res.ok) {
                    alert('Регистрация успешна! Теперь войдите.');
                } else {
                    const data = await res.json();
                    authError.innerText = data.detail || 'Ошибка регистрации';
                }
            } catch (e) {
                authError.innerText = 'Ошибка сети. Сервер спит?';
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            authToken = null;
            localStorage.removeItem('auth_token');
            checkAuth();
        });

        function saveLocal() { localStorage.setItem('my_tasks_offline', JSON.stringify(tasks)); }
        function loadLocal() { const local = localStorage.getItem('my_tasks_offline'); return local ? JSON.parse(local) : []; }

        async function loadTasks() {
            tasks = loadLocal(); 
            renderTasks();

            if (!authToken || !navigator.onLine) return;

            if (taskList.innerHTML === '' || taskList.innerHTML.includes('Пусто')) {
                taskList.innerHTML = '<div class="loading">Загрузка с сервера...</div>';
            }

            try {
                const response = await fetch(`${API_BASE}/api/tasks`, { headers: { 'Authorization': `Bearer ${authToken}` } });
                if (response.ok) {
                    tasks = await response.json();
                    saveLocal(); renderTasks();
                } else if (response.status === 401) {
                    localStorage.removeItem('auth_token'); 
                    authToken = null;
                    checkAuth();
                }
            } catch (e) { 
                console.log("Нет связи с сервером, работаем офлайн.");
            }
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderTasks();
        }

        function getRepeatText(type) {
            if (!type || type === 'none') return '';
            if (type === 'daily') return 'Каждый день';
            if (type === 'weekly') return 'Каждую неделю';
            if (!isNaN(parseInt(type))) return `Каждые ${type} дн.`;
            return 'Повтор';
        }

        function renderTasks() {
            taskList.innerHTML = '';
            
            // Получаем текст из поиска (в нижнем регистре для удобства)
            const searchText = searchInput.value.toLowerCase();

            let filteredTasks = tasks.filter(task => {
                // 1. Фильтр по вкладкам (Все / Активные / Архив)
                if (currentFilter === 'active' && task.progress >= 100) return false;
                if (currentFilter === 'done' && task.progress < 100) return false;
                
                // 2. Фильтр по поиску
                if (searchText && !task.title.toLowerCase().includes(searchText)) return false;
                
                return true;
            });

            if (filteredTasks.length === 0) {
                taskList.innerHTML = `<div class="empty-msg">Пусто</div>`;
                return;
            }

            filteredTasks.forEach((task) => {
                const index = tasks.findIndex(t => t.id === task.id); 
                const div = document.createElement('div');
                const isDone = task.progress === 100 ? 'done' : '';
                div.className = `task-item p-${task.priority} ${isDone}`;
                
                const repeatText = getRepeatText(task.repeat_type);
                let repeatHtml = repeatText ? `<span class="repeat-badge">${repeatText}</span>` : '';

                div.innerHTML = `
                    <div class="task-header">
                        <div class="task-title-wrapper">
                            <div class="title-row">
                                <span class="task-title">${task.title}</span>
                                <span class="priority-badge">${task.priority}</span>
                                ${repeatHtml}
                            </div>
                        </div>
                        <div class="task-actions">
                            <button class="check-btn ${isDone ? 'done' : ''}" onclick="toggleComplete(${index})">✓</button>
                            <button class="delete-btn" onclick="deleteTask(${index})">🗑️</button>
                        </div>
                    </div>
                    <div class="progress-controls">
                        <input type="range" min="0" max="100" value="${task.progress}" oninput="updateProgress(${index}, this.value)" onchange="saveToServer(${index})">
                        
                        <input type="number" min="0" max="100" value="${task.progress}" 
                               onchange="updateProgress(${index}, this.value); saveToServer(${index})" 
                               style="width: 60px; background: var(--bg); color: var(--text); border: 1px solid #444; border-radius: 4px; padding: 4px; text-align: center;">
                        
                        <span class="percent-sign">%</span>
                    </div>
                `;
                taskList.appendChild(div);
            });
        }

        async function addTask() {
            const title = taskInput.value.trim();
            if (!title) return;
            
            let repeatType = repeatInput.value;
            if (repeatType === 'custom') {
                const days = parseInt(customIntervalInput.value);
                if (days > 0) repeatType = days.toString();
                else repeatType = 'none';
            }

            const newTask = { 
                title: title, 
                priority: priorityInput.value, 
                repeat_type: repeatType,
                progress: 0, 
                created_at: new Date().toISOString(), 
                subtasks: '[]',
                tempId: Date.now() 
            };
            tasks.unshift(newTask);
            taskInput.value = '';
            customIntervalInput.value = '';
            saveLocal(); renderTasks();

            if (navigator.onLine && authToken) {
                try {
                    const response = await fetch(`${API_BASE}/api/tasks`, { 
                        method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` }, 
                        body: JSON.stringify(newTask) 
                    });
                    if (response.ok) { const data = await response.json(); newTask.id = data.id; saveLocal(); }
                } catch (e) { console.log("Сохранено локально"); }
            }
        }

        function updateProgress(index, value) {
            let val = parseInt(value);
            if (isNaN(val)) val = 0;
            if (val < 0) val = 0; if (val > 100) val = 100;
            tasks[index].progress = val;
            saveLocal(); renderTasks(); 
        }

        async function saveToServer(index) {
            const task = tasks[index];
            if (!task.id || !navigator.onLine || !authToken) return;
            try {
                await fetch(`${API_BASE}/api/tasks/${task.id}`, { 
                    method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` }, 
                    body: JSON.stringify({ 
                        id: task.id, progress: task.progress, priority: task.priority, 
                        subtasks: task.subtasks, repeat_type: task.repeat_type 
                    }) 
                });
            } catch (e) { console.log("Офлайн"); }
        }

        function toggleComplete(index) {
            const task = tasks[index];
            if (task.progress === 100 && task.repeat_type !== 'none') {
                task.progress = 0;
                task.created_at = new Date().toISOString();
                alert('Задача выполнена! Прогресс сброшен для следующего повторения.');
            } else {
                task.progress = task.progress === 100 ? 0 : 100;
            }
            saveLocal(); renderTasks(); saveToServer(index);
        }

        async function deleteTask(index) {
            if (!confirm('Удалить?')) return;
            const task = tasks[index];
            tasks.splice(index, 1);
            saveLocal(); renderTasks();
            if (task.id && navigator.onLine && authToken) {
                try { await fetch(`${API_BASE}/api/tasks/${task.id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${authToken}` } }); } catch (e) {}
            }
        }

        addBtn.addEventListener('click', addTask);
        taskInput.addEventListener('keypress', function(e) { if (e.key === 'Enter') addTask(); });
        
        checkAuth();
    </script>
</body>
</html>
